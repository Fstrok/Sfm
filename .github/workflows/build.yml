name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SFM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sfm.jks"
            echo "SFM_KEYSTORE=$RUNNER_TEMP/sfm.jks" >> "$GITHUB_ENV"
          fi
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Build release APK
        env:
          SFM_KEYSTORE_PASSWORD: ${{ secrets.SFM_KEYSTORE_PASSWORD }}
          SFM_KEY_ALIAS: ${{ secrets.SFM_KEY_ALIAS }}
          SFM_KEY_PASSWORD: ${{ secrets.SFM_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: sfm-apk
          path: app/build/outputs/apk/release/*.apk
